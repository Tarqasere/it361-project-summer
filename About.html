<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <title>About and Contact</title>
 
 
 <link rel="stylesheet" href="About.css">
 
</head>

<body>
 <h1>Campus Events Hub</h1>
 <h2>About Us</h2>
 <p>
     Campus Events Hub is a website for university events.
     Students can view events and register for them.
 </p>

  <hr>

  <h2>Team Members</h2>

  <div class="team-members">
    <div class="member">Student Name 1</div>
    <div class="member">Student Name 2</div>
    <div class="member">Student Name 3</div>
    <div class="member">Student Name 4</div>
  </div>
  <hr>

  <h2>Contact Us</h2>

  <form action="#" method="post">
      <label for="name">Full Name:</label>
      <br>
      <input type="text" id="name" name="name" required>
      <br><br>
      <label for="email">Email:</label>
      <br>
      <input type="email" id="email" name="email" required>
      <br><br>
      <label for="message">Message:</label>
      <br>
      <textarea id="message" name="message" rows="5" required></textarea>
      <br><br>
      <button type="submit">Send</button>
        <button type="reset">Clear</button>

    </form>
    <hr>
    <p>Copyright 2026 Campus Events Hub</p>
</body>

</html>
